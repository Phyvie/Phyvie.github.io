<template id="project-header-section-template">
<section class="project-header-section"
         style="position: relative">
    <h1 class="project-header-section__title" data-ref="text:project-title"></h1>
    <div class="project-header-section__media">
        <div class="scroll-container">
            <div class="scroll-container__content-container">
                <div class="project-header-section__video-container scroll-container__item" style="aspect-ratio: 16/9">
                    <img class="project-header-section__thumbnail" data-ref="image:thumbnail" src="" alt="">
                    <div class="project-header-section__video-play-button"
                         data-scriptName="video-play-button"> ▶ </div>
                    <video class="project-header-section__trailer" data-ref="video:trailer" controls ></video>
                </div>
            </div>
            <div class="scroll-container__bottom-navigation-line">
                <div class="scroll-container__bot-nav-line-button"
                     data-scriptName="video-toggle"
                    data-scroll=".project-header-section__video-container"> ▶ Video </div>
            </div>
        </div>
    </div>
    <div class="project-header-section__data-table">
        <div class="project-header-section__data-table-main">
            <div class="project-header-section__table-item project-header-section__project-type">
                <span class="project-header-section__table-label"> 🏷️️ </span>
                <span class="project-header-section__table-value" data-ref="text:project-type"></span>
            </div>
            <div class="project-header-section__table-item project-header-section__origin">
                <span class="project-header-section__table-label"> 🏛️ </span>
                <span class="project-header-section__table-value" data-ref="text:origin"></span>
            </div>
            <div class="project-header-section__table-item project-header-section__time">
                <span class="project-header-section__table-label"> <img class="media--img-in-font" src="../../Data/Icons/Calendar.png" alt="Date"> </span>
                <span class="project-header-section__table-value" data-ref="text:time"> </span>
            </div>
            <div class="project-header-section__table-item project-header-section__team-size">
                <span class="project-header-section__table-label"> <img class="media--img-in-font" src="../../Data/Icons/Group.png" alt="Group-Size"> </span>
                <span class="project-header-section__table-value" data-ref="text:team-size"> </span>
            </div>
        </div>
        <div class="project-header-section__tools">
            <span class="project-header-section__tools-title"> tools:</span>
            <span class="project-header-section__tools-icons" data-ref="tools:tools"></span>
        </div>
        <div class="project-header-section__roles">
            <span class="project-header-section__roles-title"> my role:</span>
            <span class="project-header-section__roles-list" data-ref="contributions:contributions"></span>
        </div>
    </div>
    <p class="project-header-section__description" data-ref="text:description"> </p>
    <div class="project-header-section__links" data-scriptName="project-page-buttons">

    </div>
</section>
</template>
