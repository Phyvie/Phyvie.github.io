<template id="WebGL-lightbox-template">
    <div id="lightbox-WebGL-build" class="lightbox-WebGL-build">
        <button id="open-project-button"
                class="tag open-project-button"
                data-scriptName="open-project-button">
            <img src="../../../Data/Icons/Unity.png" alt="unity-icon">
            <span> try yourself </span>
        </button>

        <div id="lightbox-WebGL-overlay" class="lightbox__overlay">
            <div class="lightbox__window">
                <button class="lightbox__close-btn"> &times; </button>
                <div class="lightbox__content-container">
                </div>
            </div>
        </div>
    </div>
</template>
